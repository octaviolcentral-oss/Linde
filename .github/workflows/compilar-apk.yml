name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/linde
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Abrir el zip del proyecto
        working-directory: .
        run: |
          if [ -f linde-android.zip ]; then
            unzip -o linde-android.zip
          fi
          test -f flutter/linde/pubspec.yaml

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Completar Android si falta el empaquetador
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --org com.linde --project-name linde --platforms android .
          fi

      - name: Actualizar Gradle
        run: |
          sed -i 's|gradle-8.12-all.zip|gradle-8.14-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar el APK
        run: flutter build apk --release

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: linde-apk
          path: flutter/linde/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
