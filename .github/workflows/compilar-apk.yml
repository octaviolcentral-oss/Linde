name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/linde
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Abrir el zip del proyecto
        working-directory: .
        run: |
          if [ -f linde-android.zip ]; then
            unzip -o linde-android.zip
          fi
          test -f flutter/linde/pubspec.yaml

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Completar Android si falta el empaquetador
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --org com.linde --project-name linde --platforms android .
          fi

      - name: Actualizar herramientas de Android
        run: |
          sed -i 's|gradle-8.12-all.zip|gradle-8.14-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|version "8.7.3"|version "8.11.1"|' android/settings.gradle.kts
          sed -i 's|version "2.1.0"|version "2.2.20"|' android/settings.gradle.kts
          sed -i 's|xmlns:android="http://schemas.android.com/apk/res/android"|xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android.permission.WRITE_EXTERNAL_STORAGE"|android.permission.WRITE_EXTERNAL_STORAGE" tools:replace="android:maxSdkVersion"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|FlutterActivity|FlutterFragmentActivity|g' android/app/src/main/kotlin/com/linde/vault/MainActivity.kt
          sed -i 's|@android:style/Theme.Black.NoTitleBar|Theme.AppCompat.DayNight.NoActionBar|' android/app/src/main/res/values/styles.xml
          sed -i 's|documentfile:1.1.0")|documentfile:1.1.0")\n    implementation("androidx.appcompat:appcompat:1.7.0")|' android/app/build.gradle.kts

      - name: Arreglar la libreria NSFW
        run: |
          if ! grep -q cupertino_icons pubspec.yaml; then
            sed -i '/cupertino_liquid_glass/a\  cupertino_icons: ^1.0.8' pubspec.yaml
          fi
          flutter pub get
          find "$PUB_CACHE" -path '*nsfw_detect*/android/build.gradle' -exec sed -i "/flutter_embedding_debug/d" {} +

      - name: Compilar el APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: linde-apk
          path: flutter/linde/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
